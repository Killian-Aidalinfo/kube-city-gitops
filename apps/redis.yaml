# Redis + Sentinel : tout l'état du jeu. 3 pods (1 maître + 2 réplicas), un Sentinel
# dans chacun, un disque par pod. Vague 1 : il doit être prêt avant le jeu.
# Le mot de passe vient du Secret « redis-auth », créé à la main (voir README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    # Les valeurs vivent dans ce dépôt, le chart vient du registre Bitnami :
    # une source « ref » sert de point de montage pour $values.
    - repoURL: https://github.com/Killian-Aidalinfo/kube-city-gitops.git
      targetRevision: main
      ref: values
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: redis
      targetRevision: 28.3.12       # version épinglée, testée (README du dépôt applicatif)
      helm:
        releaseName: redis
        valueFiles:
          - $values/values/redis.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-city
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff: { duration: 15s, factor: 2, maxDuration: 3m }
