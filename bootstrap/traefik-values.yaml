# Traefik, contrôleur d'Ingress du cluster. Installé AVANT tout le reste :
# c'est lui qui crée le LoadBalancer dont on tire l'IP publique pour le DNS.
# helm upgrade --install traefik traefik/traefik -n traefik --create-namespace \
#   --version 42.4.1 -f bootstrap/traefik-values.yaml

# DaemonSet : exactement un Traefik par nœud, toujours.
# Pourquoi pas un Deployment à 3 réplicas : avec externalTrafficPolicy Local, le
# LoadBalancer n'envoie du trafic qu'aux nœuds qui ont un Traefik LOCAL — un nœud
# sans Traefik jette les paquets qu'il reçoit. Or, après la perte d'un nœud le
# 19/11/2026, les 3 réplicas s'étaient reconcentrés 2/0/1 : un nœud se retrouvait
# sans Traefik. Un DaemonSet rend cette situation impossible par construction,
# et suit tout seul l'ajout ou le retrait d'un nœud.
deployment:
  kind: DaemonSet

# Crée l'IngressClass « traefik », celle que demande chart/kube-city (ingress.className).
ingressClass:
  enabled: true
  isDefaultClass: true

service:
  # Le LoadBalancer Scaleway teste le NodePort du service, pas le healthCheckNodePort
  # qu'expose externalTrafficPolicy: Local. Ses valeurs par défaut (5 s de délai,
  # 5 s d'attente, 5 essais) laissent donc jusqu'à ~25 s de trafic partir vers un
  # nœud qui n'a plus de Traefik — ce qui s'est vu pendant un drain : des échecs
  # par à-coups sur ~3 minutes. Resserré à ~6 s, sans contrepartie.
  annotations:
    service.beta.kubernetes.io/scw-loadbalancer-health-check-delay: "2s"
    service.beta.kubernetes.io/scw-loadbalancer-health-check-timeout: "1s"
    service.beta.kubernetes.io/scw-loadbalancer-health-check-max-retries: "2"
  spec:
    type: LoadBalancer
    # Local : le client garde son IP réelle (utile pour les journaux et le filtrage),
    # et le LB n'envoie que vers les nœuds qui portent un Traefik.
    externalTrafficPolicy: Local

ports:
  web:
    # Tout le HTTP part en HTTPS. Let's Encrypt suit la redirection pendant
    # le défi HTTP-01, donc cela ne gêne pas cert-manager.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  # websecure (443) garde les valeurs par défaut du chart : TLS activé,
  # et les WebSocket du jeu passent sans réglage particulier.
  traefik:
    expose:
      default: false

# Petit cluster (play2-nano) : on reste sobre.
resources:
  requests: { cpu: 100m, memory: 64Mi }
  limits: { memory: 192Mi }

log:
  level: INFO
