# Autorités Let's Encrypt, défi HTTP-01 résolu par Traefik.
# À appliquer APRÈS l'installation de cert-manager (les CRD doivent exister) :
#   kubectl apply -f bootstrap/cert-manager-clusterissuer.yaml
#
# « staging » sert à répéter sans consommer le quota Let's Encrypt (5 certificats
# par domaine et par semaine) : il délivre un certificat que le navigateur refuse,
# mais qui prouve que la chaîne DNS -> Traefik -> cert-manager fonctionne.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: killian.stein@aidalinfo.fr
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: killian.stein@aidalinfo.fr
    privateKeySecretRef:
      name: letsencrypt-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
